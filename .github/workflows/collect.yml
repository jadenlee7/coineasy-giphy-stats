name: Collect public GIPHY views
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: giphy-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate parser
        run: python3 -m unittest discover -s tests -v
      - name: Validate Wix import safeguards
        run: node tests/test_wix.mjs
      - name: Fetch verified public count
        run: python3 scripts/collect.py
      - name: Publish verified feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified GIPHY statistics'
            git push origin HEAD:main
          fi
